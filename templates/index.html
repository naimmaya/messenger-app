<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Clone</title>
    <!-- Socket.IO CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; box-sizing: border-box; }
        .container { display: flex; flex-direction: column; max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        @media(min-width: 768px) {
            .container { flex-direction: row; max-width: 900px; }
            .sidebar { width: 35%; border-right: 1px solid #ddd; padding-right: 15px; }
            .chat-area { width: 65%; padding-left: 15px; }
        }
        .sidebar { margin-bottom: 15px; }
        .chat-area { display: flex; flex-direction: column; height: 450px; }
        #messages { flex-grow: 1; border: 1px solid #ccc; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .input-group { display: flex; gap: 5px; }
        .input-group input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .input-group button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .room-btn { display: block; width: 100%; padding: 10px; margin-top: 8px; background: #e4e6eb; border: none; border-radius: 4px; cursor: pointer; text-align: left; font-weight: bold; }
        .room-btn:hover { background: #d8dadf; }
    </style>
</head>
<body>

    <h3 style="text-align: center;">Messenger Clone</h3>
    <div class="container">
        <div class="sidebar">
            <label><strong>Your Name:</strong></label><br>
            <input type="text" id="username" value="Maya" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;"><br>
            <button class="room-btn" onclick="joinRoom('Group 1')">Chat with Group 1</button>
            <button class="room-btn" onclick="joinRoom('Group 2')">Chat with Group 2</button>
        </div>
        <div class="chat-area">
            <h4 id="room-title" style="margin-top: 0; color: #555;">Select a room</h4>
            <div id="messages"></div>
            <div class="input-group">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        var socket = io();
        var currentRoom = '';
        var currentUser = '';

        socket.on('connect', function() {
            console.log('Connected to server!');
        });

        function joinRoom(room) {
            currentUser = document.getElementById('username').value || 'Anonymous';
            currentRoom = room;
            document.getElementById('room-title').innerText = "Room: " + room;
            document.getElementById('messages').innerHTML = '';
            
            socket.emit('join', { username: currentUser, room: currentRoom });
        }

        function sendMessage() {
            var msgInput = document.getElementById('message-input');
            var message = msgInput.value;
            if (message.trim() === '' || currentRoom === '') {
                alert('Please select a room and type a message!');
                return;
            }

            socket.emit('send_message', { sender: currentUser, message: message, room: currentRoom });
            msgInput.value = '';
        }

        socket.on('status', function(data) {
            var msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += '<p style="color: gray; font-style: italic; margin: 5px 0;">' + data.msg + '</p>';
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });

        socket.on('receive_message', function(data) {
            var msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += '<p style="margin: 5px 0;"><strong>' + data.sender + ':</strong> ' + data.message + '</p>';
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    </script>
</body>
</html>
