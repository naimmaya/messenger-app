<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Clone</title>
    <!-- Socket.IO CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { display: flex; max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sidebar { width: 30%; border-right: 1px solid #ddd; padding-right: 15px; }
        .chat-area { width: 70%; padding-left: 15px; display: flex; flex-direction: column; height: 400px; }
        #messages { flex-grow: 1; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .input-group { display: flex; }
        .input-group input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px 0 0 4px; }
        .input-group button { padding: 8px 15px; background: #0084ff; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        .room-btn { display: block; width: 100%; padding: 10px; margin-top: 5px; background: #e4e6eb; border: none; border-radius: 4px; cursor: pointer; text-align: left; }
        .room-btn:hover { background: #d8dadf; }
    </style>
</head>
<body>

    <h2>Messenger Clone</h2>
    <div class="container">
        <div class="sidebar">
            <label>Your Name:</label>
            <input type="text" id="username" value="Maya" style="width: 100%; padding: 5px; margin-bottom: 10px;"><br>
            <button class="room-btn" onclick="joinRoom('Group 1')">Chat with Group 1</button>
            <button class="room-btn" onclick="joinRoom('Group 2')">Chat with Group 2</button>
        </div>
        <div class="chat-area">
            <h3 id="room-title">Select a room</h3>
            <div id="messages"></div>
            <div class="input-group">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        var socket = io();
        var currentRoom = '';
        var currentUser = '';

        function joinRoom(room) {
            currentUser = document.getElementById('username').value || 'Anonymous';
            currentRoom = room;
            document.getElementById('room-title').innerText = "Room: " + room;
            document.getElementById('messages').innerHTML = '';
            
            socket.emit('join', { username: currentUser, room: currentRoom });
        }

        function sendMessage() {
            var msgInput = document.getElementById('message-input');
            var message = msgInput.value;
            if (message.trim() === '' || currentRoom === '') return;

            socket.emit('send_message', { sender: currentUser, message: message, room: currentRoom });
            msgInput.value = '';
        }

        socket.on('status', function(data) {
            var msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += '<p><em>' + data.msg + '</em></p>';
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });

        socket.on('receive_message', function(data) {
            var msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += '<p><strong>' + data.sender + ':</strong> ' + data.message + '</p>';
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    </script>
</body>
</html>
