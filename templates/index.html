<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messenger Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; margin: 0; background: #f0f2f5; }
        .sidebar { width: 30%; background: white; border-right: 1px solid #ddd; padding: 20px; }
        .chat-area { width: 70%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .messages { flex: 1; overflow-y: auto; background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        .input-box { display: flex; gap: 10px; }
        .input-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .input-box button { background: #0084ff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Messenger</h3>
        <p><b>Your Name:</b> <span id="display-user"></span></p>
        <hr>
        <button onclick="changeRoom('room1')" style="width:100%; padding:10px; margin-bottom:5px;">Chat with Group 1</button>
        <button onclick="changeRoom('room2')" style="width:100%; padding:10px;">Chat with Group 2</button>
    </div>
    <div class="chat-area">
        <div class="messages" id="message-container"></div>
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Aa Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        const socket = io(); 
        
        const username = prompt("Enter your name:") || "Guest";
        document.getElementById('display-user').innerText = username;
        let currentRoom = 'room1';

        socket.emit('join', { username: username, room: currentRoom });

        socket.on('receive_message', function(data) {
            const container = document.getElementById('message-container');
            container.innerHTML += `<div><b>${data.sender}:</b> ${data.message}</div>`;
            container.scrollTop = container.scrollHeight;
        });

        socket.on('status', function(data) {
            const container = document.getElementById('message-container');
            container.innerHTML += `<div style="color: gray; font-style: italic;">${data.msg}</div>`;
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            if(input.value.trim() !== "") {
                socket.emit('send_message', { sender: username, room: currentRoom, message: input.value });
                input.value = '';
            }
        }

        function changeRoom(newRoom) {
            currentRoom = newRoom;
            document.getElementById('message-container').innerHTML = '';
            socket.emit('join', { username: username, room: currentRoom });
        }
    </script>
</body>
</html>
